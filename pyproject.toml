[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supreme-metric"
version = "0.1.0"
description = "One metric per question sits above the rest. A spec and linter for governed metric topology."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{name = "Yanqing Jiang"}]
keywords = ["metrics", "governance", "semantic-layer", "linter", "analytics"]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
schema = ["jsonschema>=4.18"]
databricks = ["databricks-sdk>=0.30"]

[project.scripts]
supreme = "supreme_metric.cli:main"

[project.urls]
Homepage = "https://github.com/Yanqing-Jiang/supreme-metric"

[tool.hatch.build.targets.wheel]
packages = ["src/supreme_metric"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "supreme_metric/schema"
